server {
    listen 80;
    server_name api.molarplus.com;

    # Consent form links are served by the nexus service on 8001, not the main
    # API on 8000. Without this block every /api/v1/consent/* request falls
    # through to `location /`, the main backend answers 404, and generating or
    # sending a consent link fails in production while nexus sits healthy and
    # unreachable — which is exactly what happened on 2026-08-14.
    #
    # The trailing slash is load-bearing. `/api/v1/consent` without it would
    # also match /api/v1/consents/* (templates, signed, starter-library), and
    # those really are served by the main backend.
    location /api/v1/consent/ {
        proxy_pass http://localhost:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
